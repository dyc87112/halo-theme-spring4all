apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-spring4all-setting
spec:
  forms:
    - group: home
      label: 首页与品牌
      formSchema:
        - $formkit: text
          name: eyebrow
          label: 首页短标签
          value: 为开发者而生的技术社区
        - $formkit: text
          name: headline
          label: 首页主标题
          value: 让技术生根，让灵感生长。
        - $formkit: textarea
          name: description
          label: 首页介绍
          value: 从 Java 与 Spring，到 AI 与开源。分享经得起实践的知识，和认真做技术的人一起成长。
        - $formkit: checkbox
          name: use_primary_menu
          label: 使用 Halo 主菜单（无菜单时显示基础导航）
          help: 桌面与手机共用同一菜单；关闭时使用主题基础导航。
          value: true
        - $formkit: checkbox
          name: show_featured
          label: 显示首页焦点文章
          value: true
    - group: footer
      label: 页脚
      formSchema:
        - $formkit: text
          name: tagline
          label: 页脚介绍
          help: 留空时使用 Halo 站点副标题。
          value: ""
        - $formkit: text
          name: icp
          label: ICP 备案号（请按实际备案填写）
          value: ""
        - $formkit: checkbox
          name: show_network
          label: 显示友情链接
          value: true
        - $formkit: select
          name: links_source
          id: footer-links-source
          label: 友情链接来源
          value: custom
          help: 自定义列表由主题管理；插件模式从链接插件中勾选要展示的友链。
          options:
            - label: 自定义列表
              value: custom
            - label: Halo 链接管理插件
              value: plugin
        - $formkit: array
          key: footer-custom-links
          if: "$get('footer-links-source').value === 'custom'"
          keep: true
          name: links
          label: 自定义友情链接
          value: []
          min: 0
          addLabel: 添加友情链接
          emptyText: 尚未添加友情链接
          help: 支持增删、排序和逐条停用；网址填写完整的 http:// 或 https:// 地址。
          itemLabels:
            - type: text
              label: $value.name
            - type: text
              label: $value.url
          children:
            - $formkit: text
              name: name
              label: 名称
              value: ""
              validation: required
            - $formkit: url
              name: url
              label: 网址
              value: ""
              validation: required|url
            - $formkit: checkbox
              name: enabled
              label: 显示此链接
              value: true
        - $cmp: Spring4allPluginLinksField
          key: footer-plugin-links
          if: "$get('footer-links-source').value === 'plugin'"
          keep: true
          name: plugin_links
          label: 选择插件友情链接
          value: []
          help: 只展示勾选的链接；未选择时隐藏页脚友链区。
        - $formkit: checkbox
          name: show_credit
          label: 显示主题出品署名
          value: true
        - $formkit: url
          name: theme_url
          label: 主题介绍页完整网址（发布专页后可替换）
          value: https://spring4all.com/
    - group: ads
      label: 谷歌广告
      formSchema:
        - $el: h3
          children: 公共设置
          attrs:
            style:
              box-sizing: border-box
              width: "100%"
              max-width: "860px"
              margin: "20px 0 0"
              padding: "16px 20px 8px"
              border: "1px solid #dbe2ea"
              border-bottom: none
              border-radius: "10px 10px 0 0"
              background: "#f8fafc"
              font-size: "16px"
              font-weight: "600"
        - $el: p
          children: 所有位置共用。下面各广告位独立配置，完成后统一点击保存。
          attrs:
            style:
              box-sizing: border-box
              width: "100%"
              max-width: "860px"
              margin: "0"
              padding: "0 20px 14px"
              border-left: "1px solid #dbe2ea"
              border-right: "1px solid #dbe2ea"
              background: "#f8fafc"
              color: "#64748b"
              font-size: "13px"
              line-height: "1.6"
        - $formkit: checkbox
          sectionsSchema:
            outer:
              attrs:
                style:
                  box-sizing: border-box
                  width: "100%"
                  max-width: "860px"
                  margin: "0"
                  padding: "12px 20px"
                  border-left: "1px solid #dbe2ea"
                  border-right: "1px solid #dbe2ea"
                  border-bottom: "1px solid #eef2f6"
                  border-radius: "0"
                  background: "#ffffff"
          name: enabled
          label: 启用主题广告（总开关）
          value: false
        - $formkit: text
          sectionsSchema:
            outer:
              attrs:
                style:
                  box-sizing: border-box
                  width: "100%"
                  max-width: "860px"
                  margin: "0"
                  padding: "12px 20px"
                  border-left: "1px solid #dbe2ea"
                  border-right: "1px solid #dbe2ea"
                  border-bottom: "1px solid #eef2f6"
                  border-radius: "0"
                  background: "#ffffff"
          name: client_id
          label: AdSense 发布商 ID（所有广告位共用）
          placeholder: ca-pub-xxxxxxxxxxxxxxxx
          value: ""
        - $formkit: checkbox
          sectionsSchema:
            outer:
              attrs:
