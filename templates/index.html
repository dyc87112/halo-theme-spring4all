<!DOCTYPE html><html xmlns:th="https://www.thymeleaf.org" th:replace="~{layout :: html(head=~{::head},content=~{::content})}"><th:block th:fragment="head"><title th:text="${posts.page > 1 ? site.title + ' · 第 ' + posts.page + ' 页' : site.title}"></title></th:block><th:block th:fragment="content"><section class="page-heading" th:if="${posts.page > 1}"><span class="eyebrow">KEEP EXPLORING</span><h1>更多值得阅读的内容。</h1><p th:text="|第 ${posts.page} 页 · 持续积累的技术实践|"></p></section>
<section class="home-hero" th:if="${posts.page == 1}"><div class="hero-copy"><span class="eyebrow"><i class="status-dot"></i><span th:text="${theme.config.home?.eyebrow ?: '为开发者而生的技术社区'}"></span></span><h1 th:text="${theme.config.home?.headline ?: '让技术生根，让灵感生长。'}"></h1><p th:text="${theme.config.home?.description ?: '从 Java 与 Spring，到 AI 与开源。分享经得起实践的知识，和认真做技术的人一起成长。'}"></p><div class="hero-actions"><a class="button primary" href="#latest">探索最新内容 <span>↗</span></a><a class="text-link" th:href="@{${site.routes.categoriesUri}}">浏览技术专题 →</a></div><div class="hero-caption"><span class="mini-leaf">↗</span> SHARE. BUILD. GROW.</div></div><a class="featured" th:if="${theme.config.home?.show_featured != false and not #lists.isEmpty(posts.items)}" th:with="focus=${posts.items[0]}" th:href="${focus.status.permalink}"><div class="featured-top"><span th:text="${focus.spec.pinned ? '社区精选' : '最新焦点'}">最新焦点</span><span class="featured-no">01 / INSIGHT</span></div><div class="orbit-art" aria-hidden="true"><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="art-core">S<span>+</span></div><span class="art-node node-java">Java</span><span class="art-node node-ai">AI</span><span class="art-node node-spring">Spring</span><span class="art-dot"></span></div><div class="featured-bottom"><span class="eyebrow" th:text="${#lists.isEmpty(focus.categories) ? 'ENGINEERING' : focus.categories[0].spec.displayName}"></span><h2 th:text="${focus.spec.title}"></h2><div><span>阅读文章</span><span class="round-arrow">↗</span></div></div></a></section>
<section class="topic-rail" aria-label="技术分类"><a class="topic-all" th:href="@{${site.routes.categoriesUri}}"><span class="topic-icon">⌘</span><span><strong>探索技术专题</strong><small>找到你的下一站</small></span></a><a th:each="cat,c : ${categoryFinder.listAll()}" th:if="${c.index < 5}" th:href="${cat.status.permalink}"><strong th:text="${cat.spec.displayName}"></strong><small th:text="|${cat.postCount} 篇文章 ↗|"></small></a></section>
<th:block th:replace="~{modules/ads :: unit('home_top','首页列表上方')}"/>
<section id="latest" class="feed-layout"><div><div class="section-heading feed-heading"><h2><i class="status-dot"></i>最新文章</h2><span class="muted">持续更新的技术实践</span></div><nav class="filter-bar" aria-label="文章分类筛选"><a href="/" class="active">全部</a><a th:each="cat : ${categoryFinder.listAll()}" th:href="${cat.status.permalink}" th:text="${cat.spec.displayName}"></a></nav><div class="post-list"><th:block th:each="post : ${posts.items}"><th:block th:replace="~{modules/ui :: card(${post})}"/></th:block></div><th:block th:if="${#lists.isEmpty(posts.items)}"><th:block th:replace="~{modules/ui :: empty}"/></th:block><th:block th:replace="~{modules/ui :: pagination(${posts})}"/></div><th:block th:replace="~{modules/ui :: sidebar('home_sidebar')}"/></section>
</th:block></html>
