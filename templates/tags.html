<!DOCTYPE html><html xmlns:th="https://www.thymeleaf.org" th:replace="~{layout :: html(head=~{::head},content=~{::content})}"><th:block th:fragment="head"><title th:text="|全部标签 · ${site.title}|"></title></th:block><th:block th:fragment="content"><section class="page-heading"><span class="eyebrow">CONNECT THE DOTS</span><h1>从一个关键词，打开新世界。</h1><p>沿着兴趣探索，让知识彼此连接。</p></section><div class="tag-toolbar"><label for="tag-filter">查找标签</label><input id="tag-filter" type="search" placeholder="输入 Java、Spring、AI…" data-tag-filter></div><div class="tag-directory"><a th:each="tag : ${tags}" th:href="${tag.status.permalink}" data-tag-item><span class="hash">#</span><strong th:text="${tag.spec.displayName}"></strong><span class="muted" th:text="|${tag.postCount} 篇|"></span><span>↗</span></a></div><p data-tag-empty hidden class="empty-state">没有匹配的标签，换个关键词试试。</p><th:block th:if="${#lists.isEmpty(tags)}"><th:block th:replace="~{modules/ui :: empty}"/></th:block></th:block></html>
