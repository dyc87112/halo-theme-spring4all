<!DOCTYPE html><html xmlns:th="https://www.thymeleaf.org"><th:block th:fragment="metadata(title,description,path,cover,type)" th:if="${theme.config.seo?.enable_metadata != false}" th:with="base=${#strings.endsWith(site.url,'/') ? #strings.substring(site.url,0,#strings.length(site.url)-1) : site.url},url=${#strings.startsWith(path,'http') ? path : base + path}"><link rel="canonical" th:href="${url}"><meta property="og:type" th:content="${type}"><meta property="og:title" th:content="${title}"><meta property="og:site_name" th:content="${site.title}"><meta property="og:url" th:content="${url}"><meta property="og:description" th:if="${not #strings.isEmpty(description)}" th:content="${description}"><meta property="og:image" th:if="${not #strings.isEmpty(cover)}" th:content="${#strings.startsWith(cover,'http') ? cover : base + cover}"></th:block></html>
