<!DOCTYPE html><html xmlns:th="https://www.thymeleaf.org"><article th:fragment="card(moment)" class="moment-card" th:with="content=${moment.spec.content}"><header class="post-meta"><span class="author-link" th:if="${moment.owner != null}"><span class="avatar-small" th:text="${#strings.substring(moment.owner.displayName ?: 'S',0,1)}"></span><strong th:text="${moment.owner.displayName}"></strong></span><a th:href="@{/moments/{name}(name=${moment.metadata.name})}"><time th:if="${moment.spec.releaseTime != null}" th:datetime="${moment.spec.releaseTime}" th:text="${#temporals.format(moment.spec.releaseTime,'yyyy-MM-dd HH:mm')}"></time></a></header><div class="prose" th:if="${not #strings.isEmpty(content.html)}" th:utext="${content.html}"></div><div class="moment-media" th:if="${not #lists.isEmpty(content.medium)}"><th:block th:each="medium : ${content.medium}"><a th:if="${medium.type.name == 'PHOTO'}" th:href="${medium.url}" target="_blank" rel="noopener"><img th:src="${medium.url}" alt="瞬间图片" loading="lazy"></a><video th:if="${medium.type.name == 'VIDEO'}" th:src="${medium.url}" controls preload="metadata"></video><audio th:if="${medium.type.name == 'AUDIO'}" th:src="${medium.url}" controls preload="none"></audio><a th:if="${medium.type.name == 'POST'}" th:href="${medium.url}" class="button subtle">阅读关联文章 ↗</a></th:block></div><div class="moment-tags"><span th:each="tag : ${moment.spec.tags}" th:text="|# ${tag} |"></span></div></article></html>
