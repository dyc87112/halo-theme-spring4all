<!DOCTYPE html><html xmlns:th="https://www.thymeleaf.org"><th:block th:fragment="ad"><th:block th:with="ads=${theme.config.ads}"><section class="sidebar-ad" data-sidebar-ad aria-label="广告" th:if="${ads?.enabled == true and (ads?.preview == true or (ads?.client_id != null and ads.client_id.matches('ca-pub-[0-9]{16}') and ads?.slot_id != null and ads.slot_id.matches('[0-9]+')))}" th:classappend="${ads?.show_mobile == true ? 'sidebar-ad-mobile' : ''}"><span class="sidebar-ad-label">广告</span><div class="sidebar-ad-preview" th:if="${ads?.preview == true}"><span>广告位预览</span><small>仅用于检查布局</small></div><ins th:unless="${ads?.preview == true}" class="adsbygoogle" data-theme-ad style="display:block;min-height:250px" th:attr="data-ad-client=${ads.client_id},data-ad-slot=${ads.slot_id}" data-ad-format="auto" data-full-width-responsive="false"></ins></section></th:block></th:block></html>
