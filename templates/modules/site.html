<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<th:block th:fragment="brand(showSubtitle)">
  <a class="brand" href="/" th:aria-label="${site.title}">
    <img th:if="${not #strings.isEmpty(site.logo)}" th:src="${site.logo}" alt="" width="36" height="36">
    <span th:unless="${not #strings.isEmpty(site.logo)}" class="brand-mark" aria-hidden="true" th:text="${#strings.substring(site.title ?: '站点',0,1)}"></span>
    <span class="brand-copy"><span class="brand-title" th:text="${site.title}"></span><small th:if="${showSubtitle and not #strings.isEmpty(site.subtitle)}" th:text="${site.subtitle}"></small></span>
  </a>
</th:block>
<th:block th:fragment="navigation(menu)">
  <th:block th:if="${menu != null and not #lists.isEmpty(menu.menuItems)}"><th:block th:replace="~{modules/ui :: menu(${menu.menuItems})}"/></th:block>
  <th:block th:unless="${menu != null and not #lists.isEmpty(menu.menuItems)}"><a href="/">首页</a><a th:href="@{${site.routes.categoriesUri}}">分类</a><a th:href="@{${site.routes.archivesUri}}">归档</a><a th:href="@{${site.routes.tagsUri}}">标签</a><a th:if="${pluginFinder.available('PluginMoments')}" href="/moments">瞬间</a></th:block>
</th:block>
</html>
