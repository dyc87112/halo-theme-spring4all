<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<th:block th:fragment="unit(position, name)" th:with="ads=${theme.config.ads}">
  <th:block th:if="${ads?.enabled == true}">
    <th:block th:with="sidebar=${position == 'post_sidebar'},enabled=${position == 'post_sidebar' ? ads['sidebar_enabled'] != false : ads[position + '_enabled'] == true},client=${ads.client_id ?: ''},slot=${position == 'post_sidebar' ? ads.slot_id ?: '' : ads[position + '_slot_id'] ?: ''},mobile=${position == 'post_sidebar' ? ads.show_mobile == true : ads[position + '_show_mobile'] == true},format=${ads[position + '_format'] ?: 'auto'}">
      <section class="theme-ad" data-theme-ad-container aria-label="广告" th:if="${enabled and (ads.preview == true or (client.matches('ca-pub-[0-9]{16}') and slot.matches('[0-9]+')))}" th:classappend="${(sidebar ? 'sidebar-ad ' : '') + (mobile ? 'theme-ad-mobile' : '')}" th:attr="data-ad-position=${position},data-sidebar-ad=${sidebar ? 'true' : null}">
        <span class="theme-ad-label">广告</span>
        <div class="theme-ad-preview" th:if="${ads.preview == true}"><span th:text="${name}"></span><small>广告位预览 · 仅用于检查布局</small></div>
        <ins th:unless="${ads.preview == true}" class="theme-ad-unit" data-theme-ad th:style="${'display:block;min-height:' + ((sidebar or position == 'home_sidebar') ? '250px' : '120px')}" th:attr="data-ad-client=${client},data-ad-slot=${slot},data-ad-format=${format.matches('auto|horizontal|rectangle') ? format : 'auto'}" data-full-width-responsive="false"></ins>
      </section>
    </th:block>
  </th:block>
</th:block>
</html>
