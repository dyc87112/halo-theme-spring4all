<!DOCTYPE html><html xmlns:th="https://www.thymeleaf.org"><body>
<ul th:fragment="menu(items)" class="menu-tree"><li th:each="item : ${items}"><a th:href="${item.status.href}" th:text="${item.status.displayName}" th:target="${item.spec.target?.value}" rel="noopener"></a><details th:if="${not #lists.isEmpty(item.children)}"><summary aria-label="展开子菜单">⌄</summary><th:block th:replace="~{modules/ui :: menu(${item.children})}"/></details></li></ul>
<nav th:fragment="pagination(list)" class="pagination" aria-label="分页" th:if="${list.totalPages > 1}"><a class="button subtle" th:if="${list.hasPrevious()}" th:href="${list.prevUrl}">← 上一页</a><span th:text="|第 ${list.page} / ${list.totalPages} 页|"></span><a class="button subtle" th:if="${list.hasNext()}" th:href="${list.nextUrl}">下一页 →</a></nav>
<div th:fragment="empty" class="empty-state"><span class="empty-symbol">{ }</span><h2>这里的故事，正待发生</h2><p>这个栏目还没有文章，先去看看其他技术内容吧。</p><a class="button primary" href="/">回到首页 →</a></div>
<article th:fragment="card(post)" class="post-card"><div class="post-card-main"><div class="post-labels"><a th:each="cat,c : ${post.categories}" th:if="${c.index < 1}" class="category-label" th:href="${cat.status.permalink}" th:text="${cat.spec.displayName}"></a><span class="pinned" th:if="${post.spec.pinned}">置顶</span><span th:each="tag,t : ${post.tags}" th:if="${t.index < 2}" class="quiet-tag" th:text="|# ${tag.spec.displayName}|"></span></div><h2><a th:href="${post.status.permalink}" th:text="${post.spec.title}"></a></h2><p class="excerpt" th:text="${post.status.excerpt}"></p><div class="post-meta"><a class="author-link" th:if="${post.owner != null}" th:href="${post.owner.permalink}"><span class="avatar-small" th:text="${#strings.substring(post.owner.displayName ?: 'S',0,1)}"></span><span th:text="${post.owner.displayName}"></span></a><span>·</span><time th:if="${post.spec.publishTime != null}" th:datetime="${post.spec.publishTime}" th:text="${#temporals.format(post.spec.publishTime,'yyyy-MM-dd')}"></time><span th:if="${post.stats != null}" th:text="|${post.stats.visit} 阅读|"></span></div></div><a class="post-visual" tabindex="-1" aria-hidden="true" th:href="${post.status.permalink}" th:attr="data-topic=${#lists.isEmpty(post.categories) ? '技术' : post.categories[0].spec.displayName}"><img th:if="${not #strings.isEmpty(post.spec.cover)}" th:src="${post.spec.cover}" alt="" loading="lazy" width="200" height="140"><th:block th:if="${#strings.isEmpty(post.spec.cover)}"><span class="visual-code">&lt; / &gt;</span><strong th:text="${#lists.isEmpty(post.categories) ? 'ENGINEERING' : post.categories[0].spec.displayName}"></strong><small>SPRINGFORALL / INSIGHTS</small></th:block></a></article>
<aside th:fragment="sidebar(adPosition)" class="sidebar"><section class="community-card"><span class="eyebrow">DEVELOPERS, TOGETHER.</span><h2>技术的价值，<br>在于分享。</h2><p>在这里，发现新工具，交流真实经验，把灵感变成下一次实践。</p><a th:href="@{${site.routes.categoriesUri}}">找到你的技术方向 <span>↗</span></a><div class="community-art" aria-hidden="true"><span>{</span><span>✳</span><span>}</span></div></section><th:block th:if="${adPosition != null}"><th:block th:replace="~{modules/ads :: unit(${adPosition},'首页侧栏')}"/></th:block><section class="side-section"><div class="section-heading"><h2>探索标签</h2><a th:href="@{${site.routes.tagsUri}}" aria-label="查看全部标签">↗</a></div><div class="tag-cloud"><a th:each="tag : ${tagFinder.list(1,12).items}" th:href="${tag.status.permalink}"><span th:text="|# ${tag.spec.displayName}|"></span><small th:text="${tag.postCount}"></small></a></div></section><section class="side-section"><span class="eyebrow">KEEP BUILDING</span><p class="side-note">保持好奇。持续构建。<br>每一份经验，都值得被记录。</p><a class="text-link" th:href="@{${site.routes.archivesUri}}">翻阅社区文章 →</a></section></aside>
</body></html>
