<!DOCTYPE html><html xmlns:th="https://www.thymeleaf.org" th:replace="~{layout :: html(head=~{::head},content=~{::content})}"><th:block th:fragment="head"><title th:text="|文章归档 · ${site.title}|"></title></th:block><th:block th:fragment="content"><section class="page-heading"><span class="eyebrow">THE KNOWLEDGE ARCHIVE</span><h1>每一次记录，都在积累。</h1><p>沿着时间，回看社区的技术探索。</p></section><section class="archive-year" th:each="archive : ${archives.items}"><h2 th:text="${archive.year}"></h2><div><section class="archive-month" th:each="month : ${archive.months}"><h3 th:text="|${month.month} 月|"></h3><a th:each="post : ${month.posts}" th:href="${post.status.permalink}"><time th:text="${#temporals.format(post.spec.publishTime,'MM-dd')}"></time><span th:text="${post.spec.title}"></span><span>↗</span></a></section></div></section><th:block th:if="${#lists.isEmpty(archives.items)}"><th:block th:replace="~{modules/ui :: empty}"/></th:block><th:block th:replace="~{modules/ui :: pagination(${archives})}"/></th:block></html>
