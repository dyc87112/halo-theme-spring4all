<!DOCTYPE html><html xmlns:th="https://www.thymeleaf.org" th:replace="~{layout :: html(head=~{::head},content=~{::content})}"><th:block th:fragment="head"><title th:text="|技术专题 · ${site.title}|"></title></th:block><th:block th:fragment="content"><section class="page-heading"><span class="eyebrow">EXPLORE / TOPICS</span><h1>每一种好奇，都有方向。</h1><p>从一门语言到一套架构，找到值得深入的技术领域。</p></section><div class="category-grid"><a class="category-tile" th:each="cat,c : ${categoryFinder.listAll()}" th:href="${cat.status.permalink}"><span class="tile-top"><span class="tile-number" th:text="${c.count < 10 ? '0' + c.count : c.count}"></span><span>↗</span></span><span class="tile-glyph" aria-hidden="true">{<i>✳</i>}</span><h2 th:text="${cat.spec.displayName}"></h2><p th:text="${#strings.isEmpty(cat.spec.description) ? '技术洞察、实用指南与开发实践。' : cat.spec.description}"></p><span class="tile-count" th:text="|${cat.postCount} 篇文章|"></span></a></div><th:block th:if="${#lists.isEmpty(categoryFinder.listAll())}"><th:block th:replace="~{modules/ui :: empty}"/></th:block></th:block></html>
