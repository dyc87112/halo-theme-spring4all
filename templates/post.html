<!DOCTYPE html><html xmlns:th="https://www.thymeleaf.org" th:replace="~{layout :: html(head=~{::head},content=~{::content})}"><th:block th:fragment="head"><title th:text="|${post.spec.title} · ${site.title}|"></title><th:block th:replace="~{modules/seo :: metadata(${post.spec.title},${post.status.excerpt},${post.status.permalink},${post.spec.cover},'article')}"/></th:block><th:block th:fragment="content"><div class="reading-progress" aria-hidden="true"></div><header class="article-heading"><nav class="breadcrumb" aria-label="面包屑"><a href="/">首页</a><span>/</span><a th:each="cat : ${post.categories}" th:href="${cat.status.permalink}" th:text="${cat.spec.displayName}"></a></nav><div class="post-labels"><a th:each="cat : ${post.categories}" class="category-label" th:href="${cat.status.permalink}" th:text="${cat.spec.displayName}"></a></div><h1 th:text="${post.spec.title}"></h1><p class="article-deck" th:text="${post.status.excerpt}"></p><div class="post-meta"><a th:if="${post.owner != null}" class="author-link" th:href="${post.owner.permalink}"><span class="avatar-small" th:text="${#strings.substring(post.owner.displayName ?: 'S',0,1)}"></span><strong th:text="${post.owner.displayName}"></strong></a><time th:if="${post.spec.publishTime != null}" th:datetime="${post.spec.publishTime}" th:text="${#temporals.format(post.spec.publishTime,'yyyy年MM月dd日')}"></time><span data-read-time></span><span th:if="${post.stats != null}" th:text="|${post.stats.visit} 阅读|"></span><button class="text-button" data-copy-link>复制链接 ↗</button></div></header><div class="reading-layout"><article class="article-body"><img class="article-cover" th:if="${not #strings.isEmpty(post.spec.cover)}" th:src="${post.spec.cover}" alt="文章封面"><div class="prose" id="article-content" th:utext="${post.content.content}"></div><div class="article-end"><span>— 感谢阅读 —</span><div class="tag-cloud"><a th:each="tag : ${post.tags}" th:href="${tag.status.permalink}" th:text="|# ${tag.spec.displayName}|"></a></div></div><nav class="post-navigation" th:with="cursor=${postFinder.cursor(post.metadata.name)}" aria-label="相邻文章"><a th:if="${cursor.hasPrevious()}" th:href="${cursor.previous.status.permalink}"><small>← 上一篇</small><strong th:text="${cursor.previous.spec.title}"></strong></a><a th:if="${cursor.hasNext()}" th:href="${cursor.next.status.permalink}"><small>下一篇 →</small><strong th:text="${cursor.next.spec.title}"></strong></a></nav><section class="comments" th:if="${haloCommentEnabled}"><h2>一起交流</h2><p class="muted">分享你的思考，让讨论更进一步。</p><halo:comment group="content.halo.run" kind="Post" th:attr="name=${post.metadata.name}"/></section></article><aside class="reading-aside"><nav class="toc-panel" aria-label="文章目录"><span class="eyebrow">ON THIS PAGE</span><h2>本文目录</h2><ol data-toc></ol><a class="text-link" href="#main">回到文章顶部 ↑</a></nav><th:block th:replace="~{modules/sidebar-ad :: ad}"/></aside></div></th:block></html>
