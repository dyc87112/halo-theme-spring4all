<!DOCTYPE html><html xmlns:th="https://www.thymeleaf.org" th:replace="~{layout :: html(head=~{::head},content=~{::content})}"><th:block th:fragment="head"><title th:text="${category.spec.displayName + ' · ' + site.title}"></title></th:block><th:block th:fragment="content"><section class="page-heading"><a class="breadcrumb" href="/">首页 / 技术专题</a><span class="eyebrow">CATEGORY / SPRINGFORALL</span><h1 th:text="${category.spec.displayName}"></h1><p th:text="${category.spec.description ?: '在这个技术方向，积累扎实的知识与实践。'}"></p><span class="result-count" th:text="|共 ${posts.total} 篇文章|"></span></section><section class="feed-layout"><div><div class="post-list"><th:block th:each="post : ${posts.items}"><th:block th:replace="~{modules/ui :: card(${post})}"/></th:block></div><th:block th:if="${#lists.isEmpty(posts.items)}"><th:block th:replace="~{modules/ui :: empty}"/></th:block><th:block th:replace="~{modules/ui :: pagination(${posts})}"/></div><th:block th:replace="~{modules/ui :: sidebar}"/></section></th:block></html>
